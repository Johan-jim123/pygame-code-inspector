<!DOCTYPE html>
<html>
<head>
    <title>Python Code Checker</title>
    <style>
        body {
            background-color: #121212;
            color: #00ff66;
            font-family: 'Courier New', monospace;
            padding: 30px;
            max-width: 750px;
            margin: auto;
        }

        h1 {
            color: #fff;
            border-bottom: 2px solid #00ff66;
            padding-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 220px;
            background: #1e1e1e;
            color: #fff;
            border: 2px solid #00ff66;
            padding: 10px;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #fff;
        }

        #result-box {
            margin-top: 25px;
            background: #1e1e1e;
            border: 1px dashed #00ff66;
            padding: 15px;
        }

        ul {
            color: #ff5555;
        }
    </style>
</head>
<body>

    <h1>Python Code Checker</h1>
    <p>Paste your Pygame code below to check for game loop bugs and FPS drops before running it.</p>

    <textarea id="code-input" placeholder="Paste python code here..."></textarea>
    <br>
    <button onclick="checkCode()">Run Inspector</button>

    <div id="result-box" style="display: none;">
        <h2 id="score-text"></h2>
        <h3 id="grade-text"></h3>
        <h4>Issues list:</h4>
        <ul id="issues-list"></ul>
    </div>

    <script>
        function checkCode() {
            var codeText = document.getElementById('code-input').value;
            
            fetch('/api/inspect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: codeText })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                var box = document.getElementById('result-box');
                box.style.display = 'block';

                if (data.error) {
                    box.innerHTML = '<h3 style="color:red">' + data.error + '</h3>';
                } else {
                    document.getElementById('score-text').innerText = 'Score: ' + data.score + ' / 100';
                    document.getElementById('grade-text').innerText = 'Grade: ' + data.grade;

                    var list = document.getElementById('issues-list');
                    list.innerHTML = '';
                    
                    data.issues.forEach(function(issue) {
                        var li = document.createElement('li');
                        li.innerText = issue;
                        list.appendChild(li);
                    });
                }
            });
        }
    </script>
</body>
</html>
