<!DOCTYPE html>
<html>
<head>
    <title>Python Code Checker</title>
    <style>
        body {
            background-color: #121212;
            color: #00ff66;
            font-family: 'Courier New', monospace;
            padding: 30px;
            max-width: 750px;
            margin: auto;
        }

        h1 {
            color: #fff;
            border-bottom: 2px solid #00ff66;
            padding-bottom: 8px;
        }

        .qol-banner {
            background: #1a261c;
            border: 1px solid #00ff66;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .preset-btns {
            margin-bottom: 10px;
        }

        .btn-secondary {
            background: #2a2a2a;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 6px 12px;
            margin-right: 8px;
            cursor: pointer;
            font-family: monospace;
        }

        .btn-secondary:hover {
            background: #00ff66;
            color: #000;
        }

        textarea {
            width: 100%;
            height: 220px;
            background: #1e1e1e;
            color: #fff;
            border: 2px solid #00ff66;
            padding: 10px;
            font-size: 14px;
            box-sizing: border-box;
        }

        button.btn-main {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        button.btn-main:hover {
            background: #fff;
        }

        #result-box {
            margin-top: 25px;
            background: #1e1e1e;
            border: 1px dashed #00ff66;
            padding: 15px;
        }

        ul {
            color: #ff5555;
        }
    </style>
</head>
<body>

    <h1>Python Code Checker</h1>
    
    <div class="qol-banner">
        <strong>Major QoL Features:</strong> 1-Click Code Presets | CPU Freeze Risk Alerts | Actionable Fix Snippets
    </div>

    <div class="preset-btns">
        <span>Quick Test Presets: </span>
        <button class="btn-secondary" onclick="loadClean()">Load Clean Sample</button>
        <button class="btn-secondary" onclick="loadBuggy()">Load Buggy Sample</button>
    </div>

    <textarea id="code-input" placeholder="Paste python code here..."></textarea>
    <br>
    <button class="btn-main" onclick="checkCode()">Run Inspector</button>

    <div id="result-box" style="display: none;">
        <h2 id="score-text"></h2>
        <h3 id="grade-text"></h3>
        <h4>Issues & Recommended Fixes:</h4>
        <ul id="issues-list"></ul>
    </div>

    <script>
        function loadBuggy() {
            document.getElementById('code-input').value = 
`import pygame

# Missing pygame.init()
screen = pygame.display.set_mode((800, 600))

running = True
while running:
    # Unmonitored loop (No event polling)
    screen.fill((0, 0, 0))
    pygame.display.flip()
    # Missing clock.tick()
`;
        }

        function loadClean() {
            document.getElementById('code-input').value = 
`import pygame

pygame.init()
screen = pygame.display.set_mode((800, 600))
clock = pygame.time.Clock()

running = True
while running:
    clock.tick(60)
    for event in pygame.event.get():
        if event.type == pygame.QUIT:
            running = False
            
    screen.fill((30, 30, 30))
    pygame.display.flip()

pygame.quit()`;
        }

        function checkCode() {
            var codeText = document.getElementById('code-input').value;
            
            fetch('/api/inspect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: codeText })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                var box = document.getElementById('result-box');
                box.style.display = 'block';

                if (data.error) {
                    box.innerHTML = '<h3 style="color:red">' + data.error + '</h3>';
                } else {
                    document.getElementById('score-text').innerText = 'Score: ' + data.score + ' / 100';
                    document.getElementById('grade-text').innerText = 'Grade: ' + data.grade;

                    var list = document.getElementById('issues-list');
                    list.innerHTML = '';
                    
                    data.issues.forEach(function(issue) {
                        var li = document.createElement('li');
                        li.innerText = issue;
                        list.appendChild(li);
                    });
                }
            });
        }
    </script>
</body>
</html>
